services:
  pokerbot:
    build: .
    init: true
    restart: unless-stopped
    env_file: ${POKERBOT_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /data/pokerbot.sqlite
    ports:
      - "127.0.0.1:${POKERBOT_HOST_PORT:-8080}:8080"
    volumes:
      - pokerbot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 15s
      timeout: 3s
      start_period: 5s

volumes:
  pokerbot-data:
